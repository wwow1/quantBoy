# Daily backtest report configuration
# Edit this file to change backtest parameters without touching code.

# Backtest period (YYYYMMDD). "auto" for end = latest bundle date.
start: "20260101"
end: "auto"

# Include all CSI 300 (沪深300) constituent stocks in the universe.
# When true, daily_report.py fetches the index weight from Tushare and
# merges the codes into the universe at runtime.
hs300: true

# Backtest universe: code + display name (ETFs + representative stocks)
# These are always included. When hs300=true, the ~300 CSI300 constituents
# are added automatically.
universe:
  # ETFs
  - code: "510300"
    name: "沪深300ETF"
  - code: "510500"
    name: "中证500ETF"
